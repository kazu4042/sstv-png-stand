<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSTV Aggregator - 管理者ダッシュボード</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#008d54',
                        forestLight: '#e6f3ec',
                        earth: '#8b7d6b',
                        ink: '#231815',
                        paper: '#f9f9f9'
                    },
                    fontFamily: {
                        sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f9f9f9; color: #231815; font-family: 'Zen Kaku Gothic New', sans-serif; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- 管理者画面はサイドバーなし -->

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-paper relative w-full">
        <header class="top-nav h-16 px-6 flex items-center shrink-0 bg-white border-b border-gray-100 shadow-sm justify-between" style="z-index: 30;">
            <div class="flex items-center">
                <span class="font-bold text-ink tracking-widest flex items-center" style="font-size: 1.2rem;">
                    <i data-lucide="shield-check" class="w-6 h-6 inline mr-2 text-forest"></i> TurboPNG 管理システム
                </span>
            </div>
            <a href="/logout" class="text-sm font-bold text-red-600 hover:text-white hover:bg-red-600 px-4 py-2 rounded-lg transition-colors border border-red-600 flex items-center">
                <i data-lucide="log-out" class="w-4 h-4 inline mr-1"></i> ログアウト
            </a>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center items-start">
            <div class="bg-white p-6 md:p-10 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.04)] w-full max-w-4xl border border-gray-100">
                <div class="mb-8 border-b border-gray-100 pb-6 flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-ink tracking-widest flex items-center gap-3">
                            <i data-lucide="shield-check" class="text-forest w-8 h-8"></i> ユーザー管理
                        </h1>
                        <p class="text-earth text-sm mt-2 tracking-wider">登録されているすべてのアカウント情報</p>
                    </div>
                    <div class="bg-forestLight text-forest px-6 py-3 rounded-xl flex items-center gap-3">
                        <i data-lucide="users" class="w-6 h-6"></i>
                        <div>
                            <div class="text-xs font-bold opacity-80">総アカウント数</div>
                            <div class="text-2xl font-bold leading-none">{{ users|length }}</div>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200">
                                <th class="p-4 font-bold text-ink/70 text-sm tracking-widest">ID</th>
                                <th class="p-4 font-bold text-ink/70 text-sm tracking-widest">メールアドレス</th>
                                <th class="p-4 font-bold text-ink/70 text-sm tracking-widest">登録日時</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for user in users %}
                            <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                <td class="p-4 text-ink font-mono text-sm">#{{ user.id }}</td>
                                <td class="p-4 text-ink font-bold">{{ user.email }}</td>
                                <td class="p-4 text-earth text-sm">{{ user.created_at }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" class="p-8 text-center text-earth">ユーザーはまだ登録されていません</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
