<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>カレンダー (履歴) - SSTV Aggregator</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#008d54',
                        forestLight: '#e6f3ec',
                        earth: '#8b7d6b',
                        ink: '#231815',
                        paper: '#f9f9f9'
                    },
                    fontFamily: {
                        sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { 
            background-color: #f9f9f9; 
            color: #231815; 
            font-family: 'Zen Kaku Gothic New', sans-serif;
            display: flex; height: 100vh; overflow: hidden;
            margin: 0;
        }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #ffffff; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 20px 40px; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        
        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            color: #8b7d6b;
            padding: 10px 0;
            border-bottom: 2px solid #f1f5f9;
        }
        
        .calendar-cell {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .calendar-cell:hover {
            border-color: #008d54;
            box-shadow: 0 4px 12px rgba(0,141,84, 0.1);
        }
        
        .calendar-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }
        .calendar-cell.empty:hover {
            box-shadow: none;
        }
        
        .calendar-cell.has-history {
            background: #e6f3ec;
            border-color: #008d54;
        }
        
        .calendar-cell.has-history .day-num {
            color: #008d54;
            font-weight: bold;
        }
        
        .calendar-cell.today {
            background: #fff;
            border: 2px solid #38bdf8;
        }
        
        .day-num {
            font-size: 1.2rem;
            color: #475569;
        }
        
        .history-badge {
            margin-top: 4px;
            background: #008d54;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        
        /* モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        
        .history-list-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .history-list-item:hover {
            background: #f8fafc;
        }
    </style>
</head>
<body>

{% include 'sidebar.html' %}

<main class="main-wrapper relative">

    <header class="top-nav h-16 px-4 flex items-center shrink-0 bg-white border-b border-gray-100 shadow-sm" style="z-index: 30;">
        <button class="p-2 rounded-full hover:bg-gray-100 text-ink/70 transition-colors" id="toggle-btn" style="background:transparent; border:none; cursor:pointer;">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <span class="ml-4 font-bold text-ink tracking-widest" style="font-size: 1.1rem;">SSTV Aggregator</span>
    </header>

    <div class="content-scroll">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-ink flex items-center gap-2">
                        <i data-lucide="calendar" class="w-7 h-7 text-forest"></i> 履歴カレンダー
                    </h1>
                    <p class="text-earth text-sm mt-1">あなたがこれまでに送信した音声データの記録です。</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <button id="prev-month" class="p-2 rounded-full bg-white border border-gray-200 hover:bg-gray-50 transition-colors">
                        <i data-lucide="chevron-left" class="w-5 h-5 text-ink"></i>
                    </button>
                    <div id="current-month" class="text-xl font-bold text-ink w-32 text-center"></div>
                    <button id="next-month" class="p-2 rounded-full bg-white border border-gray-200 hover:bg-gray-50 transition-colors">
                        <i data-lucide="chevron-right" class="w-5 h-5 text-ink"></i>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <div class="calendar-grid mb-2">
                    <div class="calendar-day-header">日</div>
                    <div class="calendar-day-header">月</div>
                    <div class="calendar-day-header">火</div>
                    <div class="calendar-day-header">水</div>
                    <div class="calendar-day-header">木</div>
                    <div class="calendar-day-header">金</div>
                    <div class="calendar-day-header">土</div>
                </div>
                <div id="calendar-body" class="calendar-grid">
                    <!-- Calendar cells will be injected here via JS -->
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal -->
<div id="history-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="flex items-center justify-between mb-6">
            <h2 id="modal-date-title" class="text-xl font-bold text-ink"></h2>
            <button id="close-modal" class="p-2 text-earth hover:text-ink transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        
        <ul id="history-list-container" class="history-list">
            <!-- Items injected via JS -->
        </ul>
    </div>
</div>

<script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Sidebar Toggle Logic
    const toggleBtn = document.getElementById('toggle-btn');
    const sidebar = document.getElementById('sidebar');
    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
    });

    let currentDate = new Date();
    let historyData = {}; // key: "YYYY-MM-DD", value: array of history objects

    async function fetchHistory() {
        try {
            const res = await fetch('/api/history');
            const data = await res.json();
            if(data.status === 'success') {
                // Group by YYYY-MM-DD
                data.history.forEach(item => {
                    const datePart = item.timestamp.split(' ')[0]; // Assumes "YYYY-MM-DD HH:MM:SS" format
                    if(!historyData[datePart]) {
                        historyData[datePart] = [];
                    }
                    historyData[datePart].push(item);
                });
                renderCalendar();
            }
        } catch(e) {
            console.error("履歴の取得に失敗しました", e);
        }
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth(); // 0-11
        
        document.getElementById('current-month').innerText = `${year}年 ${month + 1}月`;
        
        const firstDay = new Date(year, month, 1).getDay(); // 0(Sun) - 6(Sat)
        const daysInMonth = new Date(year, month + 1, 0).getDate(); // 28-31
        
        const calBody = document.getElementById('calendar-body');
        calBody.innerHTML = '';
        
        const today = new Date();
        const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
        const todayDate = today.getDate();

        // Empty cells for days before the 1st
        for(let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'calendar-cell empty';
            calBody.appendChild(emptyCell);
        }
        
        // Days of the month
        for(let d = 1; d <= daysInMonth; d++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            
            if(isCurrentMonth && d === todayDate) {
                cell.classList.add('today');
            }
            
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayHistory = historyData[dateStr] || [];
            
            let html = `<div class="day-num">${d}</div>`;
            
            if(dayHistory.length > 0) {
                cell.classList.add('has-history');
                html += `<div class="history-badge">${dayHistory.length} 件</div>`;
                
                cell.addEventListener('click', () => {
                    openModal(dateStr, dayHistory);
                });
            }
            
            cell.innerHTML = html;
            calBody.appendChild(cell);
        }
    }

    // Navigation
    document.getElementById('prev-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });
    
    document.getElementById('next-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    // Modal Logic
    const modal = document.getElementById('history-modal');
    const closeModalBtn = document.getElementById('close-modal');
    
    function openModal(dateStr, records) {
        document.getElementById('modal-date-title').innerText = `${dateStr} の送信履歴`;
        const listContainer = document.getElementById('history-list-container');
        listContainer.innerHTML = '';
        
        // Sort by time descending
        records.sort((a, b) => b.timestamp.localeCompare(a.timestamp));
        
        records.forEach(rec => {
            const timePart = rec.timestamp.split(' ')[1] || rec.timestamp;
            
            const li = document.createElement('li');
            li.className = 'history-list-item';
            li.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="bg-forestLight p-2 rounded-full text-forest">
                        <i data-lucide="radio" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="font-bold text-ink">${timePart}</div>
                        <div class="text-xs text-earth font-mono">Image ID: 0x${rec.image_id}</div>
                    </div>
                </div>
                <a href="/result?image_id=${rec.image_id}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-ink text-sm rounded-lg font-bold transition-colors text-center inline-block" style="text-decoration:none;">
                    結果を見る
                </a>
            `;
            listContainer.appendChild(li);
        });
        
        lucide.createIcons();
        modal.style.display = 'flex';
    }
    
    closeModalBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });
    
    modal.addEventListener('click', (e) => {
        if(e.target === modal) {
            modal.style.display = 'none';
        }
    });

    // Start
    fetchHistory();
</script>
</body>
</html>
