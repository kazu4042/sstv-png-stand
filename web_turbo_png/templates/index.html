<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSTV Aggregator - アップロード</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#008d54',
                        forestLight: '#e6f3ec',
                        earth: '#8b7d6b',
                        ink: '#231815',
                        paper: '#f9f9f9'
                    },
                    fontFamily: {
                        sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* (Removed old sidebar CSS) */
        body {
            background-color: #f9f9f9;
            color: #231815;
            font-family: 'Zen Kaku Gothic New', sans-serif;
        }

        /* 🍔 トップナビゲーションバー */


        /* 📱 左サイドバー */


        @media (min-width: 1024px) {}

        /* (Removed old session-item CSS) */
        .btn-submit {
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 141, 84, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 🌊 ウォーターフォール用キャンバス */
        .waterfall-wrapper {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin-top 0.4s ease, margin-bottom 0.4s ease;
        }

        .waterfall-wrapper.active {
            max-height: 300px;
            opacity: 1;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        /* 観測地情報などの入力 */
        input[type="text"],
        input[type="number"] {
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #008d54;
            box-shadow: 0 0 0 2px rgba(0, 141, 84, 0.2);
            outline: none;
        }

        /* プログレスバーUI */
        .progress-wrapper {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin-top 0.4s ease;
        }

        .progress-wrapper.active {
            max-height: 100px;
            opacity: 1;
            margin-top: 1.5rem;
        }

        .progress-fill {
            transition: width 0.3s ease;
        }

        /* カスタムトグルスイッチ */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #008d54;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #008d54;
        }

        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e5e7eb;
        }
    </style>
</head>

<body class="flex min-h-screen md:h-screen overflow-x-hidden md:overflow-hidden bg-paper text-ink">
    <!-- Sidebar -->
    {% include 'sidebar.html' %}


    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen md:min-h-0 overflow-y-auto bg-paper relative">

        <header class="top-nav h-16 px-4 flex items-center shrink-0 bg-white border-b border-gray-100 shadow-sm"
            style="z-index: 30;">
            <button class="p-2 rounded-full hover:bg-gray-100 text-ink/70 transition-colors" id="toggle-btn"
                style="background:transparent; border:none; cursor:pointer;">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <span class="ml-4 font-bold text-ink tracking-widest" style="font-size: 1.1rem;">SSTV Aggregator</span>
        </header>


        <div class="flex-1 p-3 sm:p-6 md:p-8 flex justify-center items-start">
            <div
                class="bg-white p-4 sm:p-7 md:p-10 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.04)] w-full max-w-2xl border border-gray-100">
                <div class="text-center mb-6">
                    <h1
                        class="text-xl sm:text-2xl md:text-3xl font-bold text-ink tracking-wide sm:tracking-widest flex items-center justify-center gap-2 sm:gap-3 mb-2 flex-wrap">
                        <i data-lucide="radio" class="text-forest w-6 h-6 sm:w-8 sm:h-8"></i> SSTV 協調復元エンジン
                    </h1>
                    <div class="text-xs sm:text-sm text-earth font-medium tracking-wider mb-4">4-FSK Audio Signal Aggregator v1.2</div>
                    
                    <!-- デコードエンジン状態バッジ (表示のみ、切り替えは管理者ダッシュボード) -->
                    <div class="inline-flex items-center gap-2 p-1.5 px-3 rounded-xl bg-gray-50 border border-gray-200">
                        <span class="text-xs text-earth font-bold">デコードエンジン:</span>
                        <span class="px-2.5 py-0.5 text-xs font-bold rounded-full {% if current_engine_mode == 'JPEG' %}bg-amber-100 text-amber-800 border border-amber-300{% else %}bg-emerald-100 text-emerald-800 border border-emerald-300{% endif %}">
                            {% if current_engine_mode == 'JPEG' %}JPEG モード (ざらざら感・段階的復元){% else %}PNG モード (0/100 多数決復元){% endif %}
                        </span>
                    </div>
                </div>

                <form action="/api/upload" method="POST" enctype="multipart/form-data" id="upload-form">
                    <!-- File Upload -->
                    <div class="flex flex-col md:flex-row gap-4 mb-4">
                        <div class="relative flex-1">
                            <div class="flex items-center justify-center w-full p-4 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 hover:bg-forestLight hover:border-forest text-ink/70 hover:text-forest transition-all cursor-pointer font-bold tracking-wide sm:tracking-widest h-full text-center"
                                id="upload-btn-text">
                                <i data-lucide="folder-up" class="w-5 h-5 mr-2 shrink-0"></i> 音声ファイルを選択 (.wav, .m4a, .mp3 等)
                            </div>
                            <input type="file" name="file" id="audio-file" accept="audio/*,.wav,.m4a,.mp3,.aac,.ogg,.flac,.webm,.caf,.3gp" required
                                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        </div>
                        <button type="button" id="btn-preview"
                            class="bg-forestLight text-forest px-6 py-4 rounded-xl font-bold tracking-widest flex items-center justify-center gap-2 hover:bg-forest hover:text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                            <i data-lucide="play" class="w-5 h-5"></i> プレビュー
                        </button>
                    </div>

                    <div id="file-name-display"
                        class="text-center text-sm text-forest font-bold mb-6 min-h-[1.5rem] tracking-widest"></div>

                    <!-- Spectrum Toggle -->
                    <div
                        class="flex items-center justify-between p-4 bg-gray-50 rounded-xl mb-6 border border-gray-100">
                        <div class="flex items-center gap-3">
                            <i data-lucide="activity" class="text-earth w-5 h-5"></i>
                            <span class="text-sm font-bold text-ink tracking-widest">音声スペクトルを表示する</span>
                        </div>
                        <div
                            class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="spectrum-toggle"
                                class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300" />
                            <label for="spectrum-toggle"
                                class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-all duration-300"></label>
                        </div>
                    </div>

                    <!-- Waterfall Canvas -->
                    <div class="waterfall-wrapper bg-black rounded-xl border-2 border-gray-200 overflow-hidden relative mb-6"
                        id="waterfall-wrapper">
                        <canvas id="waterfall" class="w-full h-[200px] block"></canvas>
                        <div class="absolute inset-0 pointer-events-none"
                            style="background: linear-gradient(90deg, rgba(255,255,255,0) 15%, rgba(255,255,255,0.1) 15%, rgba(255,255,255,0) 16%, rgba(255,255,255,0) 45%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0) 46%);">
                        </div>
                    </div>

                    <button type="submit"
                        class="btn-submit w-full bg-forest text-white py-4 rounded-xl font-bold tracking-widest flex justify-center items-center gap-2"
                        id="btn-submit" disabled>
                        <i data-lucide="rocket" class="w-5 h-5"></i> サーバーに送信して解析を開始
                    </button>

                    <!-- プログレスバー -->
                    <div class="progress-wrapper" id="progress-wrapper">
                        <div class="text-center text-sm font-bold text-earth tracking-widest mb-2" id="progress-text">
                            処理中... 0%</div>
                        <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                            <div class="progress-fill h-full bg-forest w-0" id="progress-fill"></div>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const fileInput = document.getElementById('audio-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const btnPreview = document.getElementById('btn-preview');
        const btnSubmit = document.getElementById('btn-submit');
        const waterfallWrapper = document.getElementById('waterfall-wrapper');
        const spectrumToggle = document.getElementById('spectrum-toggle');
        const canvas = document.getElementById('waterfall');
        const ctx = canvas.getContext('2d', { alpha: false });

        let audioContext;
        let analyser;
        let source;
        let animationId;
        let isPlaying = false;

        // スペクトルの表示/非表示の切り替え
        if (spectrumToggle) {
            spectrumToggle.addEventListener('change', function () {
                if (this.checked && fileInput && fileInput.files.length > 0) {
                    waterfallWrapper.classList.add('active');
                } else {
                    waterfallWrapper.classList.remove('active');
                }
            });
        }

        // キャンバスのサイズ設定
        canvas.width = 600;
        canvas.height = 200;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // カラーマップ関数
        function getColor(value) {
            if (value === 0) return [0, 0, 0];
            let r, g, b;
            if (value < 64) { r = 0; g = 0; b = value * 4; }
            else if (value < 128) { r = 0; g = (value - 64) * 4; b = 255 - (value - 64) * 4; }
            else if (value < 192) { r = (value - 128) * 4; g = 255; b = 0; }
            else { r = 255; g = 255 - (value - 192) * 4; b = 0; }
            return [r, g, b];
        }

        // ファイル選択時の処理
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];

            if (isPlaying) {
                btnPreview.click();
            }

            if (file) {
                fileNameDisplay.innerHTML = `<i data-lucide="file-audio" class="w-4 h-4 inline mr-1"></i> ${file.name}`;
                lucide.createIcons();
                btnPreview.disabled = false;
                btnSubmit.disabled = false;
                if (spectrumToggle.checked) {
                    waterfallWrapper.classList.add('active');
                }
            } else {
                fileNameDisplay.innerHTML = '';
                btnPreview.disabled = true;
                btnSubmit.disabled = true;
                waterfallWrapper.classList.remove('active');
            }
        });



        // プレビュー再生ボタンの処理
        btnPreview.addEventListener('click', async function () {
            if (isPlaying) {
                // 停止処理
                if (source) source.stop();
                cancelAnimationFrame(animationId);
                btnPreview.innerHTML = '<i data-lucide="play" class="w-5 h-5"></i> プレビュー';
                btnPreview.classList.remove('bg-red-50', 'text-red-600', 'hover:bg-red-600', 'hover:text-white');
                btnPreview.classList.add('bg-forestLight', 'text-forest', 'hover:bg-forest', 'hover:text-white');
                lucide.createIcons();
                isPlaying = false;
                return;
            }

            const file = fileInput.files[0];
            if (!file) return;

            // ボタンの状態変更
            btnPreview.innerHTML = '<i data-lucide="pause" class="w-5 h-5"></i> 停止';
            btnPreview.classList.remove('bg-forestLight', 'text-forest', 'hover:bg-forest', 'hover:text-white');
            btnPreview.classList.add('bg-red-50', 'text-red-600', 'hover:bg-red-600', 'hover:text-white');
            lucide.createIcons();
            isPlaying = true;

            // Toggleがオフでも再生したらオンにする
            if (!spectrumToggle.checked) {
                spectrumToggle.checked = true;
                waterfallWrapper.classList.add('active');
            }

            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.2;

                source = audioContext.createBufferSource();
                source.buffer = audioBuffer;

                source.connect(analyser);
                analyser.connect(audioContext.destination);

                source.start(0);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const nyquist = audioContext.sampleRate / 2;
                const maxDisplayFreq = 6000;
                const maxBinIndex = Math.floor((maxDisplayFreq / nyquist) * bufferLength);
                const imgData = ctx.createImageData(canvas.width, 1);

                function drawWaterfall() {
                    if (!isPlaying) return;
                    animationId = requestAnimationFrame(drawWaterfall);

                    analyser.getByteFrequencyData(dataArray);

                    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height - 1, 0, 1, canvas.width, canvas.height - 1);

                    for (let x = 0; x < canvas.width; x++) {
                        const binIndex = Math.floor((x / canvas.width) * maxBinIndex);
                        const val = dataArray[binIndex];

                        const [r, g, b] = getColor(val);
                        const pxOffset = x * 4;
                        imgData.data[pxOffset] = r;
                        imgData.data[pxOffset + 1] = g;
                        imgData.data[pxOffset + 2] = b;
                        imgData.data[pxOffset + 3] = 255;
                    }
                    ctx.putImageData(imgData, 0, 0);
                }

                drawWaterfall();

                source.onended = () => {
                    isPlaying = false;
                    cancelAnimationFrame(animationId);
                    btnPreview.innerHTML = '<i data-lucide="play" class="w-5 h-5"></i> プレビュー';
                    btnPreview.classList.remove('bg-red-50', 'text-red-600', 'hover:bg-red-600', 'hover:text-white');
                    btnPreview.classList.add('bg-forestLight', 'text-forest', 'hover:bg-forest', 'hover:text-white');
                    lucide.createIcons();
                };
            } catch (err) {
                console.warn("[Preview] Browser decode failed:", err);
                alert("お使いの端末ブラウザではプレビュー再生が非対応の形式ですが、サーバーでのデコード・解析には問題なく送信できます。");
                btnPreview.innerHTML = '<i data-lucide="play" class="w-5 h-5"></i> プレビュー';
                btnPreview.classList.remove('bg-red-50', 'text-red-600', 'hover:bg-red-600', 'hover:text-white');
                btnPreview.classList.add('bg-forestLight', 'text-forest', 'hover:bg-forest', 'hover:text-white');
                lucide.createIcons();
                isPlaying = false;
            }
        });

        // URLバーからBasic認証情報の credentials を除去
        if (window.location.href.includes('@')) {
            try {
                const cleanUrl = window.location.protocol + '//' + window.location.host + window.location.pathname + window.location.search;
                window.history.replaceState(null, '', cleanUrl);
            } catch (_) {}
        }

        // 安全なAPI URL生成関数
        function safeApiUrl(path) {
            return window.location.protocol + '//' + window.location.host + path;
        }

        // 音声バッファから 16bit モノラル PCM WAV Blob を生成する超軽量高速エンコーダ
        function audioBufferToWavBlob(buffer) {
            const numChannels = 1;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            let channelData;
            if (buffer.numberOfChannels === 1) {
                channelData = buffer.getChannelData(0);
            } else {
                const ch0 = buffer.getChannelData(0);
                const ch1 = buffer.getChannelData(1);
                channelData = new Float32Array(ch0.length);
                for (let i = 0; i < ch0.length; i++) {
                    channelData[i] = (ch0[i] + ch1[i]) * 0.5;
                }
            }
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const dataByteCount = channelData.length * bytesPerSample;
            const wavBuffer = new ArrayBuffer(44 + dataByteCount);
            const view = new DataView(wavBuffer);
            
            function writeStr(offset, str) {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            }
            // RIFF チャンク
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + dataByteCount, true);
            writeStr(8, 'WAVE');
            
            // fmt サブチャンク
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            
            // data サブチャンク
            writeStr(36, 'data');
            view.setUint32(40, dataByteCount, true);
            
            let offset = 44;
            for (let i = 0; i < channelData.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        // スマホ録音 (.m4a, .mp3, .aac, etc.) をブラウザ標準の Web Audio API で一瞬で PCM WAV にトランスコード
        async function convertAudioFileToWav(file, onProgressText) {
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            if (ext === 'wav' && (file.type === 'audio/wav' || file.type === 'audio/x-wav')) {
                return file;
            }
            if (onProgressText) onProgressText('スマホ音声を高精度PCM WAVに最適化変換中...');
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return file;
                const audioCtx = new AudioContextClass();
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const wavBlob = audioBufferToWavBlob(audioBuffer);
                const newName = file.name.replace(/\.[^/.]+$/, "") + ".wav";
                return new File([wavBlob], newName, { type: 'audio/wav' });
            } catch (err) {
                console.warn('クライアント側自動WAV変換をスキップ (元ファイルで送信):', err);
                return file;
            }
        }

        // フォーム送信時のプログレス処理（アップロード進捗 ＋ サーバー解析進捗）
        const uploadForm = document.getElementById('upload-form');
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');

        uploadForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i data-lucide="hourglass" class="w-5 h-5"></i> 準備中...';
            lucide.createIcons();
            progressWrapper.classList.add('active');
            progressFill.style.width = '0%';
            progressFill.classList.remove('bg-red-500');
            progressFill.classList.add('bg-forest');
            progressText.classList.remove('text-red-600');
            progressText.classList.add('text-earth');

            const fileInput = document.getElementById('audio-file');
            let uploadFile = fileInput.files && fileInput.files[0];
            if (!uploadFile) {
                alert("音声ファイルを選択してください。");
                resetSubmitBtn();
                return;
            }

            // スマホ録音形式（.m4a等）を自動でPCM WAVに変換
            uploadFile = await convertAudioFileToWav(uploadFile, function(msg) {
                progressText.innerText = msg;
                progressFill.style.width = '10%';
            });

            btnSubmit.innerHTML = '<i data-lucide="hourglass" class="w-5 h-5"></i> 送信中...';
            lucide.createIcons();
            progressFill.style.width = '15%';
            progressText.innerText = 'ファイルをサーバーに送信中... 0%';

            const formData = new FormData();
            formData.append('file', uploadFile, uploadFile.name);
            const xhr = new XMLHttpRequest();
            xhr.withCredentials = true;

            // 1. アップロード送信中の進捗（15%〜30%）
            xhr.upload.addEventListener('progress', function (event) {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    const loadedMB = (event.loaded / (1024 * 1024)).toFixed(1);
                    const totalMB = (event.total / (1024 * 1024)).toFixed(1);
                    progressFill.style.width = (15 + (percent * 0.15)) + '%';
                    progressText.innerText = `ファイルを送信中... ${percent}% (${loadedMB}MB / ${totalMB}MB)`;
                }
            });

            // 2. サーバー到達後の処理（SSEで解析進捗を購読）
            xhr.addEventListener('load', function () {
                if (xhr.status === 200) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.success && data.job_id) {
                            progressText.innerText = 'サーバーで高速デコード解析中...';
                            progressFill.style.width = '35%';

                            const evtSource = new EventSource(`/api/progress-stream?job_id=${data.job_id}`);

                            evtSource.onmessage = function (event) {
                                const sseData = JSON.parse(event.data);

                                if (sseData.error) {
                                    progressFill.classList.remove('bg-forest');
                                    progressFill.classList.add('bg-red-500');
                                    progressText.classList.remove('text-earth');
                                    progressText.classList.add('text-red-600');
                                    progressText.innerText = `⚠️ エラー: ${sseData.error}`;
                                    alert(sseData.error);
                                    btnSubmit.disabled = false;
                                    btnSubmit.innerHTML = '<i data-lucide="rocket" class="w-5 h-5"></i> サーバーに送信して解析を開始';
                                    lucide.createIcons();
                                    evtSource.close();
                                    return;
                                }

                                const serverProg = parseInt(sseData.progress);
                                const statusMsg = sseData.status || '解析中...';
                                if (!isNaN(serverProg)) {
                                    // 30%〜100% にマッピング
                                    const totalDisplayProg = Math.min(100, Math.round(30 + (serverProg * 0.7)));
                                    progressFill.style.width = totalDisplayProg + '%';
                                    progressText.innerText = `${statusMsg} (${totalDisplayProg}%)`;

                                    if (serverProg >= 100) {
                                        progressText.innerText = "✨ デコード完了！結果画面へ移動します...";
                                        progressFill.style.width = '100%';
                                        evtSource.close();
                                        setTimeout(() => {
                                            window.location.href = `/result?job_id=${data.job_id}`;
                                        }, 600);
                                    }
                                }
                            };

                            evtSource.onerror = function () {
                                evtSource.close();
                            };
                        } else {
                            alert(data.error || "アップロードに失敗しました");
                            resetSubmitBtn();
                        }
                    } catch (e) {
                        alert("レスポンス解析エラーが発生しました");
                        resetSubmitBtn();
                    }
                } else if (xhr.status === 401) {
                    alert("ログイン認証の有効期限が切れました。ページを再読み込みしてログインし直してください。");
                    resetSubmitBtn();
                } else if (xhr.status === 413) {
                    alert("ファイルサイズが上限を超えています (最大 200MB)。短時間の録音でお試しください。");
                    resetSubmitBtn();
                } else {
                    let errMsg = "サーバーエラーが発生しました";
                    try {
                        const errData = JSON.parse(xhr.responseText);
                        if (errData.error) errMsg = errData.error;
                    } catch (_) { }
                    alert(errMsg);
                    resetSubmitBtn();
                }
            });

            xhr.addEventListener('error', function () {
                alert("通信エラーが発生しました。ネットワーク接続をご確認いただくか、ファイル形式・サイズをお確かめの上もう一度お試しください。");
                resetSubmitBtn();
            });

            function resetSubmitBtn() {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i data-lucide="rocket" class="w-5 h-5"></i> サーバーに送信して解析を開始';
                lucide.createIcons();
                progressWrapper.classList.remove('active');
            }

            xhr.open('POST', '/api/upload');
            xhr.send(formData);
        });

    </script>
</body>

</html>
