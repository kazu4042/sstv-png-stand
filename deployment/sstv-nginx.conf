server {
    listen 80;
    # ご自身のドメイン名
    server_name sstv-aggregator.space www.sstv-aggregator.space;

    # アップロードの最大サイズを制限（WAV/画像ファイル向けに大きめの200MBに設定）
    client_max_body_size 200M;

    location / {
        include proxy_params;
        # Basic認証やSSE通信をスムーズに通過させるためのヘッダー設定
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gunicornが作成するソケットファイルへリバースプロキシ
        proxy_pass http://unix:/var/www/sstv-png-stand/sstv.sock;
        
        # タイムアウト設定を長めにする（解析に時間がかかる場合があるため）
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
    }

    # 進捗通知用 SSE (Server-Sent Events) のバッファリングを無効化
    location /api/progress-stream {
        include proxy_params;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://unix:/var/www/sstv-png-stand/sstv.sock;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # 静的ファイルの直接配信（Gunicornに負荷をかけないため）
    location /static/ {
        alias /var/www/sstv-png-stand/web_turbo_png/static/;
        expires 30d;
    }
}

