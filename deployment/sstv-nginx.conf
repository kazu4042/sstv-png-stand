server {
    listen 80;
    # ご自身のドメイン名
    server_name sstv-aggregator.space www.sstv-aggregator.space;

    # アップロードの最大サイズを制限（WAVファイル向けに大きめの200MBに設定）
    client_max_body_size 200M;

    location / {
        include proxy_params;
        # Gunicornが作成するソケットファイルへリバースプロキシ
        proxy_pass http://unix:/var/www/sstv-png-stand/sstv.sock;
        
        # タイムアウト設定を長めにする（解析に時間がかかる場合があるため）
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # 静的ファイルの直接配信（Gunicornに負荷をかけないため）
    location /static/ {
        alias /var/www/sstv-png-stand/web_turbo_png/static/;
        expires 30d;
    }
}
